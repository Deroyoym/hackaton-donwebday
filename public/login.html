<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f172a">
  <title>Ingresar · Pedido Express</title>
  <link rel="stylesheet" href="/style.css">
  <style>
    body { min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: radial-gradient(1200px 600px at 10% -10%, #1e293b, #0b1220 60%); }
    .login { width: 100%; max-width: 420px; }
    .login .card { padding: 32px; }
    .login .brand { justify-content: center; margin-bottom: 22px; }
    .login .brand-txt small { color: #94a3b8; }
    .demo { margin-top: 16px; }
    .demo code { font-family: var(--mono); font-weight: 700; }
    .back { display: flex; justify-content: center; gap: 6px; align-items: center; margin-top: 18px; color: #cbd5e1; text-decoration: none; font-size: .9rem; }
    .back:hover { color: #fff; }
  </style>
</head>
<body>
  <div class="login">
    <a class="brand" href="/">
      <span class="logo" data-icon="zap"></span>
      <span class="brand-txt"><b>Pedido Express</b><small>Área del negocio</small></span>
    </a>
    <form class="card" id="form" autocomplete="on">
      <h1 class="title" style="margin:0 0 4px;font-size:1.5rem">Ingresá a tu local</h1>
      <p class="muted" style="margin:0 0 8px">Comandas, carga de pedidos con IA y tu menú.</p>
      <label for="usuario">Usuario</label>
      <input id="usuario" name="username" autocomplete="username" required autofocus>
      <label for="password">Contraseña</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <button class="btn-primary btn-lg btn-block" id="btnEntrar" type="submit" style="margin-top:20px"><span data-icon="lock"></span>Ingresar</button>
      <div id="error" class="error hidden"></div>
      <div id="demo" class="alert warn demo hidden">
        <span data-icon="info"></span>
        <div>Acceso demo: usuario <code id="dUser"></code> · contraseña <code id="dPass"></code>
          <button type="button" class="small" id="btnDemo" style="margin-top:8px">Completar datos demo</button>
        </div>
      </div>
    </form>
    <a class="back" href="/"><span data-icon="arrowRight" style="transform:rotate(180deg);display:inline-flex"></span>Ir a la página de clientes</a>
  </div>
  <script src="/common.js"></script>
  <script>
    hydrateIcons();
    const next = new URLSearchParams(location.search).get('next');
    const destino = next && next.startsWith('/admin') ? next : '/admin/';

    api('/api/auth').then((a) => {
      if (a.logueado) return location.replace(destino);
      if (a.demo) {
        $('#dUser').textContent = a.demo.usuario;
        $('#dPass').textContent = a.demo.password;
        $('#demo').classList.remove('hidden');
        $('#btnDemo').onclick = () => { $('#usuario').value = a.demo.usuario; $('#password').value = a.demo.password; $('#btnEntrar').focus(); };
      }
    }).catch(() => {});

    $('#form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = $('#btnEntrar');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Ingresando…';
      $('#error').classList.add('hidden');
      try {
        await api('/api/login', { method: 'POST', body: { usuario: $('#usuario').value, password: $('#password').value } });
        location.replace(destino);
      } catch (err) {
        $('#error').textContent = err.message;
        $('#error').classList.remove('hidden');
        btn.disabled = false;
        btn.innerHTML = icon('lock') + 'Ingresar';
      }
    });
  </script>
</body>
</html>
