<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, interactive-widget=resizes-content">
  <title>Hacé tu pedido</title>
  <link rel="stylesheet" href="style.css">
  <style>
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; background: #ece5dd; }
    header { flex: 0 0 auto; }
    header .sub { font-size: .8rem; opacity: .85; }
    #chat { flex: 1 1 auto; overflow-y: auto; padding: 12px; max-width: 720px; width: 100%; margin: 0 auto; }
    .msg { max-width: 82%; padding: 8px 12px; border-radius: 10px; margin: 6px 0; white-space: pre-wrap; word-wrap: break-word; box-shadow: 0 1px 1px rgba(0,0,0,.08); }
    .msg.bot { background: #fff; border-top-left-radius: 2px; }
    .msg.user { background: #dcf8c6; margin-left: auto; border-top-right-radius: 2px; }
    .msg.sys { background: #e1f5e8; color: var(--accent-dark); margin: 10px auto; text-align: center; font-weight: 600; }
    .typing span { display: inline-block; width: 7px; height: 7px; background: #9aa; border-radius: 50%; margin: 0 2px; animation: blink 1.2s infinite; }
    .typing span:nth-child(2) { animation-delay: .2s; } .typing span:nth-child(3) { animation-delay: .4s; }
    @keyframes blink { 0%, 80%, 100% { opacity: .2; } 40% { opacity: 1; } }
    .quick { display: flex; gap: 6px; flex-wrap: wrap; padding: 0 12px 8px; max-width: 720px; width: 100%; margin: 0 auto; }
    .quick button { background: #fff; color: var(--accent-dark); border: 1px solid #cfe3d6; border-radius: 999px; font-size: .85rem; padding: 6px 12px; }
    #resumen { flex: 0 0 auto; background: #fff; border-top: 1px solid var(--line); padding: 10px 12px; }
    #resumen .in { max-width: 720px; margin: 0 auto; }
    #resumen .items { font-size: .88rem; color: var(--muted); }
    #resumen .tot { font-weight: 700; font-size: 1.05rem; }
    form { flex: 0 0 auto; display: flex; gap: 8px; padding: 8px 12px 12px; background: #f0f0f0; }
    form .in { display: flex; gap: 8px; max-width: 720px; width: 100%; margin: 0 auto; }
    form input { border-radius: 999px; padding: 12px 16px; }
    form button { border-radius: 999px; padding: 0 18px; }
    .menu-list { margin: 4px 0 0; padding-left: 16px; }
  </style>
</head>
<body>
  <header>
    <div>
      <h1 id="negocio">Cargando…</h1>
      <div class="sub">🤖 Asistente de pedidos · responde al instante, las 24 hs</div>
    </div>
  </header>

  <div id="chat"></div>
  <div class="quick" id="quick">
    <button data-q="menu">📋 Ver el menú</button>
    <button data-q="¿Hacen envíos? ¿Cuánto sale?">🛵 ¿Hacen envíos?</button>
    <button data-q="¿Qué horarios tienen?">🕐 Horarios</button>
    <button data-q="¿Cómo puedo pagar?">💳 Formas de pago</button>
  </div>

  <div id="resumen" class="hidden">
    <div class="in">
      <div class="row" style="justify-content:space-between">
        <div style="flex:1;min-width:0">
          <div class="tot" id="rTotal"></div>
          <div class="items" id="rItems"></div>
          <div class="items" id="rFalta"></div>
        </div>
        <button id="btnConfirmar" disabled>Confirmar pedido</button>
      </div>
    </div>
  </div>

  <form id="form" autocomplete="off">
    <div class="in">
      <input id="input" placeholder="Escribí tu pedido o consulta…" maxlength="1000">
      <button id="btnEnviar" type="submit">Enviar</button>
    </div>
  </form>

  <script src="common.js"></script>
  <script>
    let config = null;
    let mensajes = [];   // historial que se manda a la IA
    let estado = null;   // último { pedido, faltantes, listo }
    let enviando = false;

    function burbuja(texto, clase, html) {
      const d = document.createElement('div');
      d.className = 'msg ' + clase;
      if (html) d.innerHTML = html; else d.textContent = texto;
      $('#chat').appendChild(d);
      $('#chat').scrollTop = $('#chat').scrollHeight;
      return d;
    }

    function mostrarResumen() {
      const p = estado?.pedido;
      if (!p || !p.items.length) { $('#resumen').classList.add('hidden'); return; }
      $('#resumen').classList.remove('hidden');
      $('#rTotal').textContent = 'Tu pedido · ' + money(p.total) + (p.envio ? ' (envío incl.)' : '');
      $('#rItems').textContent = p.items.map((i) => `${i.cantidad} × ${i.producto}`).join(', ');
      $('#rFalta').textContent = estado.listo ? '' : 'Falta: ' + estado.faltantes.join(', ');
      $('#btnConfirmar').disabled = !estado.listo;
    }

    async function enviar(texto) {
      texto = texto.trim();
      if (!texto || enviando) return;
      enviando = true;
      $('#btnEnviar').disabled = true;
      $('#quick').classList.add('hidden');
      burbuja(texto, 'user');
      mensajes.push({ role: 'user', content: texto });
      const typing = burbuja('', 'bot typing', '<span></span><span></span><span></span>');
      try {
        const r = await api('/api/chat', { method: 'POST', body: { mensajes, pedido: estado?.pedido } });
        typing.remove();
        burbuja(r.respuesta, 'bot');
        mensajes.push({ role: 'assistant', content: r.respuesta });
        estado = r;
        mostrarResumen();
      } catch (e) {
        typing.remove();
        mensajes.pop(); // no guardar el mensaje que falló, así se puede reintentar
        burbuja('⚠️ ' + e.message, 'bot');
        $('#input').value = texto;
      } finally {
        enviando = false;
        $('#btnEnviar').disabled = false;
        $('#input').focus();
      }
    }

    $('#form').addEventListener('submit', (e) => {
      e.preventDefault();
      const t = $('#input').value;
      $('#input').value = '';
      enviar(t);
    });

    $('#quick').addEventListener('click', (e) => {
      const q = e.target.dataset.q;
      if (!q) return;
      if (q === 'menu') {
        // El menú se muestra directo, sin gastar una llamada a la IA.
        burbuja('', 'bot', '<b>Nuestro menú</b><ul class="menu-list">' + config.menu.map((m) => `<li>${esc(m.producto)} — ${money(m.precio)}</li>`).join('') + `</ul>Envío: ${money(config.envio)}<br>¿Qué te gustaría pedir?`);
        return;
      }
      enviar(q);
    });

    $('#btnConfirmar').addEventListener('click', async () => {
      if (!estado?.listo) return;
      const btn = $('#btnConfirmar');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner"></span>Enviando…';
      const p = estado.pedido;
      try {
        const guardado = await api('/api/pedidos', {
          method: 'POST',
          body: {
            origen: 'chat',
            cliente: p.cliente, items: p.items, entrega: p.entrega, pago: p.pago,
            texto_original: mensajes.map((m) => (m.role === 'user' ? 'Cliente: ' : 'Asistente: ') + m.content).join('\n')
          }
        });
        burbuja(`✅ ¡Pedido #${guardado.id} confirmado! Total ${money(guardado.total)}.\nYa le llegó al local. Te avisamos por WhatsApp cuando esté listo.`, 'sys');
        mensajes = [];
        estado = null;
        mostrarResumen();
        $('#quick').classList.remove('hidden');
      } catch (e) {
        burbuja('⚠️ No se pudo confirmar: ' + e.message, 'bot');
        btn.disabled = false;
      } finally {
        btn.textContent = 'Confirmar pedido';
      }
    });

    api('/api/config').then((c) => {
      config = c;
      $('#negocio').textContent = c.negocio;
      document.title = 'Pedí en ' + c.negocio;
      burbuja(`¡Hola! 👋 Soy el asistente de ${c.negocio}. Contame qué querés pedir o preguntame lo que necesites.`, 'bot');
    }).catch((e) => burbuja('⚠️ ' + e.message, 'bot'));
  </script>
</body>
</html>
